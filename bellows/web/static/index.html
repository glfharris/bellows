<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bellows</title>
    <link rel="stylesheet" href="https://unpkg.com/uplot@1.6.31/dist/uPlot.min.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="ventilator">
      <header class="status-strip">
        <div class="brand">
          <strong>bellows</strong>
        </div>
        <div class="header-status" aria-label="Ventilator status">
          <div class="status-item status-mode">
            <strong id="modeBadge">VCV</strong>
          </div>
          <div class="status-item compact">
            <span class="status-label">Phase</span>
            <strong id="phaseStatus">INSP</strong>
          </div>
          <div class="status-item">
            <span class="status-label">Queued</span>
            <strong id="pendingHeader">None</strong>
          </div>
          <div class="status-item compact">
            <span class="status-label">Breath</span>
            <strong id="breathStatus">000</strong>
          </div>
          <div class="status-item compact">
            <span class="status-label">Time</span>
            <strong id="clock">0.0s</strong>
          </div>
        </div>
      </header>

      <section class="screen">
        <section class="waveform-bank" aria-label="Waveforms">
          <div class="waveform-tools">
            <span class="toolbar-label">Display</span>
            <button id="fitAxes" type="button">Fit axes</button>
            <button id="resetAxes" type="button">Reset axes</button>
            <label>
              Window
              <select id="windowSeconds">
                <option value="6">6s</option>
                <option value="12" selected>12s</option>
                <option value="24">24s</option>
              </select>
            </label>
          </div>
          <div id="pressure" class="chart"></div>
          <div id="flow" class="chart"></div>
          <div id="volume" class="chart"></div>
          <div id="sharedTimeAxis" class="shared-time-axis" aria-hidden="true"></div>
        </section>

        <aside class="monitor-bank" aria-label="Monitor values">
          <div class="numeric-grid">
            <div class="numeric pressure">
              <span class="numeric-label">Ppeak</span>
              <strong><span id="ppeakValue">--</span><small id="ppeakDelta"></small></strong>
              <span class="numeric-unit">cmH2O</span>
            </div>
            <div class="numeric pressure">
              <span class="numeric-label">Pmean</span>
              <strong><span id="pmeanValue">--</span><small id="pmeanDelta"></small></strong>
              <span class="numeric-unit">cmH2O</span>
            </div>
            <div class="numeric volume">
              <span class="numeric-label">VT</span>
              <strong><span id="vteValue">--</span><small id="vteDelta"></small></strong>
              <span class="numeric-unit">mL</span>
            </div>
            <div class="numeric flow">
              <span class="numeric-label">MV</span>
              <strong><span id="mvValue">--</span><small id="mvDelta"></small></strong>
              <span class="numeric-unit">L/min</span>
            </div>
          </div>

          <div class="pv-card">
            <div class="pv-header">
              <div class="section-title">PV Loop</div>
              <div class="loop-legend">
                <span><i class="legend-current"></i>Current</span>
                <span><i class="legend-previous"></i>Previous</span>
              </div>
            </div>
            <canvas id="pv"></canvas>
          </div>

          <div class="patient-summary">
            <strong id="patientSummary">Linear / Normal</strong>
            <span id="mechanicsSummary">R 10 · C 50 mL/cmH2O</span>
          </div>
        </aside>
      </section>

      <footer class="settings-bar" aria-label="Ventilator settings">
        <label class="setting-card" data-control-card="mode">
          <span class="setting-label">Mode</span>
          <select id="mode">
            <option>VCV</option>
            <option>PCV</option>
            <option>PRVC</option>
            <option>APRV</option>
          </select>
        </label>
        <label class="setting-card" data-control-card="vt">
          <span class="setting-label">VT target</span>
          <strong id="vtValue">-- mL</strong>
          <input id="vt" type="range" min="100" max="1000" step="25" />
        </label>
        <label class="setting-card" data-control-card="pinsp">
          <span class="setting-label">Pinsp</span>
          <strong id="pinspValue">-- cmH2O</strong>
          <input id="pinsp" type="range" min="5" max="40" step="1" />
        </label>
        <label class="setting-card" data-control-card="rr">
          <span class="setting-label">RR</span>
          <strong id="rrValue">--/min</strong>
          <input id="rr" type="range" min="4" max="40" step="1" />
        </label>
        <label class="setting-card" data-control-card="peep">
          <span class="setting-label">PEEP</span>
          <strong id="peepValue">-- cmH2O</strong>
          <input id="peep" type="range" min="0" max="20" step="1" />
        </label>
        <label class="setting-card" data-control-card="pHigh">
          <span class="setting-label">P high</span>
          <strong id="pHighValue">-- cmH2O</strong>
          <input id="pHigh" type="range" min="5" max="50" step="1" />
        </label>
        <label class="setting-card" data-control-card="pLow">
          <span class="setting-label">P low</span>
          <strong id="pLowValue">-- cmH2O</strong>
          <input id="pLow" type="range" min="0" max="25" step="1" />
        </label>
        <label class="setting-card" data-control-card="tHigh">
          <span class="setting-label">T high</span>
          <strong id="tHighValue">-- s</strong>
          <input id="tHigh" type="range" min="0.5" max="10" step="0.5" />
        </label>
        <label class="setting-card" data-control-card="tLow">
          <span class="setting-label">T low</span>
          <strong id="tLowValue">-- s</strong>
          <input id="tLow" type="range" min="0.2" max="2" step="0.1" />
        </label>
        <div class="settings-actions">
          <button id="advancedOpen" type="button">Advanced</button>
          <button id="modelOpen" type="button">Patient</button>
        </div>
        <div class="transport-card">
          <button id="pause">Pause</button>
          <button id="reset">Reset</button>
        </div>
      </footer>
    </main>

    <dialog id="advancedDialog" class="control-dialog">
      <form method="dialog">
        <header>
          <strong>Advanced ventilator settings</strong>
        </header>
        <label class="dialog-row">
          <span class="setting-label">I:E</span>
          <strong id="ieValue">1:--</strong>
          <input id="ieE" type="range" min="1" max="4" step="0.5" />
        </label>
        <label class="dialog-row">
          <span class="setting-label">Rise time</span>
          <strong id="riseTimeValue">-- ms</strong>
          <input id="riseTime" type="range" min="20" max="300" step="10" />
        </label>
        <label class="dialog-row">
          <span class="setting-label">Exp valve</span>
          <strong id="expValveValue">-- cmH2O*s/L</strong>
          <input id="expValve" type="range" min="0" max="20" step="1" />
        </label>
        <footer>
          <button value="close">Close</button>
        </footer>
      </form>
    </dialog>

    <dialog id="modelDialog" class="control-dialog">
      <form method="dialog">
        <header>
          <strong>Patient</strong>
        </header>
        <div class="dialog-section">Preset</div>
        <label class="dialog-row">
          <span class="setting-label">Model</span>
          <select id="lungModel"></select>
        </label>
        <label class="dialog-row">
          <span class="setting-label">Preset</span>
          <select id="preset"></select>
        </label>
        <div class="dialog-section">Mechanics</div>
        <label class="dialog-row" data-model-row="compliance">
          <span class="setting-label">Compliance</span>
          <strong id="complianceValue">-- mL/cmH2O</strong>
          <input id="compliance" type="range" min="10" max="120" step="5" />
        </label>
        <label class="dialog-row" data-model-row="inflection">
          <span class="setting-label">Inflection</span>
          <strong id="inflectionValue">-- cmH2O</strong>
          <input id="inflection" type="range" min="5" max="40" step="1" />
        </label>
        <label class="dialog-row" data-model-row="slope">
          <span class="setting-label">Slope width</span>
          <strong id="slopeValue">-- cmH2O</strong>
          <input id="slope" type="range" min="2" max="15" step="0.5" />
        </label>
        <label class="dialog-row" data-model-row="recruitable">
          <span class="setting-label">Recruitable</span>
          <strong id="recruitableValue">-- mL</strong>
          <input id="recruitable" type="range" min="300" max="2500" step="100" />
        </label>
        <label class="dialog-row" data-model-row="hysteresis">
          <span class="setting-label">Hysteresis</span>
          <strong id="hysteresisValue">-- cmH2O</strong>
          <input id="hysteresis" type="range" min="0" max="10" step="0.5" />
        </label>
        <label class="dialog-row">
          <span class="setting-label">Resistance</span>
          <strong id="resistanceValue">-- cmH2O*s/L</strong>
          <input id="resistance" type="range" min="3" max="40" step="1" />
        </label>
        <footer>
          <button value="close">Close</button>
        </footer>
      </form>
    </dialog>

    <script src="https://unpkg.com/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
